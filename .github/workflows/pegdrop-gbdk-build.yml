name: Peg Drop GBDK Build

on:
  push:
    branches:
      - pegdrop-gbdk-build
    paths:
      - 'pegdrop_build/**'
      - '.github/workflows/pegdrop-gbdk-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pegdrop_build/**'
      - '.github/workflows/pegdrop-gbdk-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Peg Drop source
        run: |
          mkdir -p pegdrop_build/src
          cat pegdrop_build/chunk00.b64 pegdrop_build/chunk01.b64 pegdrop_build/chunk02.b64 pegdrop_build/c3_00.b64 pegdrop_build/c3_01.b64 pegdrop_build/c3_tail.b64 pegdrop_build/chunk04.b64 > pegdrop_build/pegdrop-src-verified.b64
          echo '766cf7b1e757b0684bc915a4a10cf9861f38d468f13d48f3596341131258ab66  pegdrop_build/pegdrop-src-verified.b64' | sha256sum -c -
          base64 --decode pegdrop_build/pegdrop-src-verified.b64 > pegdrop_build/pegdrop-src.tgz
          tar -xzf pegdrop_build/pegdrop-src.tgz -C pegdrop_build/src
      - name: Download GBDK 4.3.0
        working-directory: pegdrop_build
        run: |
          wget -q https://github.com/gbdk-2020/gbdk-2020/releases/download/4.3.0/gbdk-linux64.tar.gz
          tar -xzf gbdk-linux64.tar.gz
          test -x gbdk/bin/lcc
      - name: Compile ROM
        working-directory: pegdrop_build/src
        run: |
          make clean || true
          make LCC="$GITHUB_WORKSPACE/pegdrop_build/gbdk/bin/lcc"
          test -s pegdrop_deluxe.gb
          sha256sum pegdrop_deluxe.gb
          ls -lh pegdrop_deluxe.gb
      - name: Install headless Game Boy emulator
        run: python -m pip install --disable-pip-version-check pyboy pillow
      - name: Extended gameplay exercise
        working-directory: pegdrop_build/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          from PIL import Image, ImageDraw
          from pyboy import PyBoy

          out = Path('emulator_test')
          out.mkdir(exist_ok=True)
          pyboy = PyBoy('pegdrop_deluxe.gb', window='null', sound_emulated=False)
          records = []

          def tick(n):
              for _ in range(n):
                  pyboy.tick()

          def press(name, settle=45):
              pyboy.button(name)
              tick(settle)

          def capture(label):
              img = pyboy.screen.image.copy()
              path = out / f'{len(records):02d}_{label}.png'
              img.save(path)
              raw = img.tobytes()
              records.append({
                  'label': label,
                  'file': path.name,
                  'sha256': sha256(raw).hexdigest(),
                  'colors': len(img.getcolors(maxcolors=1000000) or []),
                  'bbox': img.getbbox(),
              })

          tick(180)
          capture('title_idle')
          press('start', 90)
          capture('after_start')

          # Advance through the adventure presentation until the board is reached.
          for i in range(7):
              press('a', 90)
              capture(f'advance_{i+1}')

          # Exercise precision aiming and five full shots.
          directions = [('left', 6), ('right', 12), ('left', 4), ('right', 8), ('left', 10)]
          for shot, (direction, count) in enumerate(directions, 1):
              for _ in range(count):
                  press(direction, 3)
              capture(f'shot_{shot}_aimed')
              press('a', 3)
              capture(f'shot_{shot}_launch')
              for sample in range(1, 8):
                  tick(120)
                  capture(f'shot_{shot}_flight_{sample}')
              tick(240)
              capture(f'shot_{shot}_settled')

          # Check pause and resume behavior.
          press('start', 60)
          capture('paused')
          press('start', 60)
          capture('resumed')

          pyboy.stop(save=False)

          unique_frames = len({r['sha256'] for r in records})
          assert records[0]['bbox'] is not None, 'Blank title frame'
          assert unique_frames >= 12, f'Insufficient visual state changes: {unique_frames}'

          (out / 'report.json').write_text(json.dumps({
              'frames_captured': len(records),
              'unique_frames': unique_frames,
              'records': records,
          }, indent=2))

          thumbs = []
          chosen = records[:9] + records[9::9]
          for rec in chosen[:16]:
              img = Image.open(out / rec['file']).convert('RGB').resize((320, 288))
              canvas = Image.new('RGB', (320, 316), 'black')
              canvas.paste(img, (0, 28))
              ImageDraw.Draw(canvas).text((6, 7), rec['label'], fill='white')
              thumbs.append(canvas)
          sheet = Image.new('RGB', (1280, 1264), 'black')
          for i, img in enumerate(thumbs):
              sheet.paste(img, ((i % 4) * 320, (i // 4) * 316))
          sheet.save(out / 'gameplay_contact_sheet.png')
          print(f'Captured {len(records)} frames with {unique_frames} unique rendered states')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pegdrop-deluxe-compiled-rom
          path: |
            pegdrop_build/src/pegdrop_deluxe.gb
            pegdrop_build/src/pegdrop_deluxe.map
            pegdrop_build/src/pegdrop_deluxe.sym
            pegdrop_build/src/emulator_test/**
          if-no-files-found: error
