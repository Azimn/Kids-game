name: Peg Drop GBDK Build

on:
  push:
    branches: [pegdrop-gbdk-build]
    paths:
      - 'pegdrop_build/**'
      - '.github/workflows/pegdrop-gbdk-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pegdrop_build/**'
      - '.github/workflows/pegdrop-gbdk-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified Peg Drop source
        run: |
          mkdir -p pegdrop_build/src
          cat pegdrop_build/chunk00.b64 pegdrop_build/chunk01.b64 pegdrop_build/chunk02.b64 pegdrop_build/c3_00.b64 pegdrop_build/c3_01.b64 pegdrop_build/c3_tail.b64 pegdrop_build/chunk04.b64 > pegdrop_build/pegdrop-src-verified.b64
          echo '766cf7b1e757b0684bc915a4a10cf9861f38d468f13d48f3596341131258ab66  pegdrop_build/pegdrop-src-verified.b64' | sha256sum -c -
          base64 --decode pegdrop_build/pegdrop-src-verified.b64 > pegdrop_build/pegdrop-src.tgz
          tar -xzf pegdrop_build/pegdrop-src.tgz -C pegdrop_build/src

      - name: Add state-aware debug mirrors and regression test
        working-directory: pegdrop_build/src
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('main.c')
          s=p.read_text()
          decl='''\n/* Fixed WRAM debug mirrors for state-aware emulator tests. */\n__at (0xC700) volatile uint8_t dbg_signature;\n__at (0xC701) volatile uint8_t dbg_state;\n__at (0xC702) volatile uint8_t dbg_level;\n__at (0xC703) volatile uint8_t dbg_balls_left;\n__at (0xC704) volatile uint8_t dbg_orange_remaining;\n__at (0xC705) volatile uint8_t dbg_active_ball_count;\n__at (0xC706) volatile uint8_t dbg_fever;\n__at (0xC707) volatile uint8_t dbg_power_active;\n__at (0xC708) volatile uint16_t dbg_ball_frames;\n__at (0xC70A) volatile uint32_t dbg_score;\n__at (0xC70E) volatile uint32_t dbg_shot_score;\n\n'''
          s=s.replace('typedef int16_t fx_t;\n',decl+'typedef int16_t fx_t;\n')
          func='''\nstatic void update_debug_mirrors(void) {\n    dbg_signature=0xA5; dbg_state=state; dbg_level=level_index;\n    dbg_balls_left=balls_left; dbg_orange_remaining=orange_remaining;\n    dbg_active_ball_count=active_ball_count; dbg_fever=fever;\n    dbg_power_active=power_active; dbg_ball_frames=balls[0].frames;\n    dbg_score=score; dbg_shot_score=shot_score;\n}\n\n'''
          s=s.replace('void main(void) {',func+'void main(void) {')
          s=s.replace('while(1){handle_input();update_state();wait_vbl_done();}','while(1){handle_input();update_state();update_debug_mirrors();wait_vbl_done();}')
          p.write_text(s)
          Path('VERIFICATION_UPDATE.md').write_text('''# Verification Update\n\nState-aware WRAM instrumentation replaces screenshot-only inference. The existing 1,000-frame watchdog remains unchanged and verified. Current campaign Level 22 uses seed 20 and is not the previously reported outlier. Seed 21 is not included in the current campaign.\n''')
          PY
          mkdir -p emulator_test
          cat > emulator_test/test_state_aware.py <<'PY'
          from pathlib import Path
          from pyboy import PyBoy
          ROM=Path(__file__).resolve().parents[1]/'pegdrop_deluxe.gb'
          BASE=0xC700
          pyboy=PyBoy(str(ROM),window='null',sound_emulated=False)
          pyboy.set_emulation_speed(0)
          def tick(n=1):
              for _ in range(n): pyboy.tick()
          def press(name,n=2): pyboy.button(name); tick(n)
          def u8(o): return pyboy.memory[BASE+o]
          def u16(o): return u8(o)|(u8(o+1)<<8)
          def u32(o): return u16(o)|(u16(o+2)<<16)
          def snap(): return {'sig':u8(0),'state':u8(1),'level':u8(2),'balls':u8(3),'orange':u8(4),'active':u8(5),'fever':u8(6),'power':u8(7),'frames':u16(8),'score':u32(10),'shot_score':u32(14)}
          tick(60)
          assert snap()['sig']==0xA5, snap()
          # Advance title, chapter/map, ready, then play, using mirrored state.
          for _ in range(8):
              if snap()['state']==2: break
              press('a',3); tick(20)
          start=snap(); assert start['state']==2 and start['balls']==10 and start['orange']==25, start
          press('a',2); tick(8); launched=snap(); assert launched['active']>0 and launched['balls']==9, launched
          press('start',2); tick(30); a=snap(); tick(60); b=snap(); assert a['frames']==b['frames'], (a,b); press('start',2); tick(5)
          for _ in range(1150):
              pyboy.tick()
              if snap()['active']==0: break
          resolved=snap(); assert resolved['active']==0 and resolved['frames']==0, resolved
          before=resolved['balls']; press('right',2); tick(2); press('a',2); tick(8)
          second=snap(); assert second['active']>0 and second['balls']==before-1, second
          pyboy.screen.image.save('emulator-state-aware.png')
          Path('state-aware-results.txt').write_text('PASS\n'+repr({'start':start,'launched':launched,'paused':a,'resolved':resolved,'second':second})+'\n')
          pyboy.stop(save=False)
          print('PASS',start,launched,resolved,second)
          PY

      - name: Download GBDK 4.3.0
        working-directory: pegdrop_build
        run: |
          wget -q https://github.com/gbdk-2020/gbdk-2020/releases/download/4.3.0/gbdk-linux64.tar.gz
          tar -xzf gbdk-linux64.tar.gz
          test -x gbdk/bin/lcc

      - name: Compile instrumented ROM
        working-directory: pegdrop_build/src
        run: |
          make clean || true
          make LCC="$GITHUB_WORKSPACE/pegdrop_build/gbdk/bin/lcc"
          test -s pegdrop_deluxe.gb
          sha256sum pegdrop_deluxe.gb

      - name: Run state-aware emulator regression
        working-directory: pegdrop_build/src
        run: |
          python -m pip install --disable-pip-version-check pyboy pillow
          python emulator_test/test_state_aware.py

      - uses: actions/upload-artifact@v4
        with:
          name: pegdrop-state-aware-build
          path: |
            pegdrop_build/src/pegdrop_deluxe.gb
            pegdrop_build/src/pegdrop_deluxe.map
            pegdrop_build/src/pegdrop_deluxe.sym
            pegdrop_build/src/main.c
            pegdrop_build/src/tiles.c
            pegdrop_build/src/tiles.h
            pegdrop_build/src/campaign_data.h
            pegdrop_build/src/Makefile
            pegdrop_build/src/VERIFICATION_UPDATE.md
            pegdrop_build/src/emulator_test/test_state_aware.py
            pegdrop_build/src/emulator-state-aware.png
            pegdrop_build/src/state-aware-results.txt
          if-no-files-found: error
